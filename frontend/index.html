<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal SmartDine</title>
    
    <!-- Mengimpor Font yang sama dengan Admin -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
    
    <style>
        :root {
            --brand: #ff6b35; --dark: #1a1a2e; --grey: #6b7280; --light: #f0f2f5;
            --shadow: 0 4px 24px rgba(0,0,0,.10); --radius: 16px;
        }
        body { 
            font-family: 'DM Sans', sans-serif; 
            background: var(--light); 
            color: var(--dark);
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; 
        }
        .portal-card {
            background: white; padding: 40px;
            border-radius: var(--radius); box-shadow: var(--shadow);
            text-align: center; width: 100%; max-width: 400px;
            box-sizing: border-box;
        }
        .logo {
            font-family: 'Playfair Display', serif; font-size: 2.5rem;
            font-weight: 900; color: var(--brand); margin-bottom: 10px;
        }
        .subtitle { color: var(--grey); margin-bottom: 30px; font-size: 1rem; }
        
        .btn {
            display: block; width: 100%; padding: 16px; margin-bottom: 15px;
            border-radius: 50px; font-size: 1.05rem; font-weight: 700;
            text-decoration: none; transition: transform 0.2s, opacity 0.2s;
            box-sizing: border-box;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-admin { background: var(--dark); color: white; }
        .btn-pelanggan { background: var(--brand); color: white; }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="logo">🍽️ SmartDine</div>
        <div class="subtitle">Sistem Manajemen Restoran Digital</div>
        
        <a href="login.html" class="btn btn-admin">Masuk sebagai Admin</a>
        <a href="pelanggan.html" class="btn btn-pelanggan">Scan QR Pelanggan</a>
    </div>
</body>
</html>
