<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal SmartDine</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
    
    <!-- Memanggil CSS Gabungan -->
    <link rel="stylesheet" href="css/index.css">
    
    <!-- Library HTML5 QR Code Scanner via CDN -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
    <div class="portal-card">
        <div class="logo" style="display: flex; align-items: center; justify-content: center;">
            <img src="assets/logo.svg" alt="SmartDine Logo" style="height: 90px; width: auto; object-fit: contain;">
        </div>
        <div class="subtitle">Sistem Pemesanan Digital</div>
        
        <!-- Tombol Admin (Hanya muncul di PC/Laptop via CSS) -->
        <a href="login.html" id="btnAdmin" class="btn btn-admin">Masuk sebagai Admin</a>
        
        <!-- Tombol untuk memicu scanner kamera -->
        <button onclick="bukaScannerQR()" class="btn btn-pelanggan" style="border: none; cursor: pointer;">Scan QR Meja</button>
    </div>

    <!-- MODAL / CONTAINER PEMINDAI KAMERA (Hidden di awal) -->
    <div id="scannerModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; justify-content:center; align-items:center; flex-direction:column; padding:20px;">
        <div style="background:white; width:100%; max-width:400px; border-radius:16px; padding:20px; text-align:center; position:relative;">
            <h3 style="margin-bottom: 15px; font-family:'Playfair Display', serif; color:var(--dark);">Arahkan Kamera ke QR Meja</h3>
            
            <!-- Area Kamera QR Reader -->
            <div id="reader" style="width:100%; border-radius:12px; overflow:hidden;"></div>
            
            <p id="scannerStatus" style="font-size: 0.85rem; color: var(--grey); margin-top: 15px;">Meminta izin akses kamera...</p>
            
            <!-- Tombol Tutup / Batal -->
            <button onclick="tutupScannerQR()" style="margin-top:15px; background:#e74c3c; color:white; border:none; padding:10px 20px; border-radius:50px; font-weight:700; cursor:pointer; width:100%;">Tutup / Batal</button>
        </div>
    </div>

    <!-- Logika pemindai QR sepenuhnya diatur di dalam file js/index.js -->
    <script src="js/index.js" defer></script>
</body>
</html>
