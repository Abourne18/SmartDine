<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - SmartDine</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
    
    <!-- Memanggil CSS Gabungan -->
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <div class="login-card">
        <div class="logo" style="display: flex; align-items: center; justify-content: center;">
            <img src="assets/logo.png" alt="SmartDine Logo" style="height: 90px; width: auto; object-fit: contain;">
        </div>
        <div class="title">Panel Akses Admin dan Dapur</div>

        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="input-field" placeholder="Masukkan username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="input-field" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="confirm-btn">Masuk Sistem</button>
        </form>
        
        <p id="pesan"></p>
        
        <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; font-family: 'DM Sans', sans-serif;">
            Belum punya akun? <a href="register.html" style="color: var(--brand); text-decoration: none; font-weight: 700;">Daftar di sini</a>
        </div>
        <a href="index.html" class="back-link">← Kembali ke Halaman Awal</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const result = await response.json();
                if (result.success) {
                    localStorage.setItem('adminSession', JSON.stringify(result.data));
                    window.location.href = 'admin.html';
                } else {
                    document.getElementById('pesan').innerText = result.message;
                }
            } catch (error) {
                document.getElementById('pesan').innerText = 'Gagal terhubung ke server.';
            }
        });
    </script>
</body>
</html>
