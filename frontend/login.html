<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - SmartDine</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
    
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-card">
        <div class="logo" style="display: flex; align-items: center; justify-content: center;">
            <img src="assets/logo.png" alt="SmartDine Logo" style="height: 90px; width: auto; object-fit: contain;">
        </div>
        <div class="title">Panel Akses Admin dan Dapur</div>

        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="input-field" placeholder="Masukkan username" required
                       oninvalid="this.setCustomValidity('Username wajib diisi!')"
                       oninput="this.setCustomValidity('')">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="input-field" placeholder="Masukkan password" required
                       oninvalid="this.setCustomValidity('Password tidak boleh kosong!')"
                       oninput="this.setCustomValidity('')">
            </div>
            <button type="submit" id="submitBtn" class="confirm-btn">Login</button>
        </form>
        
        <p id="pesan" style="text-align: center; margin-top: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;"></p>
        
        <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; font-family: 'DM Sans', sans-serif;">
            <a href="register.html" style="color: var(--brand); text-decoration: none; font-weight: 700;">Tambah Akun</a>
        </div>
        <a href="index.html" class="back-link">← Kembali ke Halaman Awal</a>
    </div>

    <script src="js/login.js" defer></script>
</body>
</html>
