<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - SmartDine</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
    
    <style>
        :root {
            --brand: #ff6b35; --dark: #1a1a2e; --grey: #6b7280; --light: #f0f2f5;
            --shadow: 0 4px 24px rgba(0,0,0,.10); --radius: 16px;
        }
        body { 
            font-family: 'DM Sans', sans-serif; background: var(--light); 
            color: var(--dark); display: flex; justify-content: center; 
            align-items: center; min-height: 100vh; margin: 0; padding: 20px;
        }
        .register-card {
            background: white; padding: 40px; border-radius: var(--radius);
            box-shadow: var(--shadow); width: 100%; max-width: 450px;
            box-sizing: border-box;
        }
        .logo {
            font-family: 'Playfair Display', serif; font-size: 2rem;
            font-weight: 900; color: var(--brand); text-align: center; margin-bottom: 5px;
        }
        .title {
            font-family: 'Playfair Display', serif; font-size: 1.3rem;
            text-align: center; margin-bottom: 30px; color: var(--dark);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 8px;
        }
        .input-field {
            width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb;
            border-radius: 12px; font-size: 1rem; outline: none; box-sizing: border-box;
            font-family: 'DM Sans', sans-serif; transition: border-color 0.2s;
        }
        .input-field:focus { border-color: var(--brand); }
        
        .confirm-btn {
            width: 100%; padding: 16px; background: var(--dark); color: white;
            border: none; border-radius: 50px; font-size: 1.05rem; font-weight: 700;
            cursor: pointer; margin-top: 10px; font-family: 'DM Sans', sans-serif;
            transition: opacity 0.2s;
        }
        .confirm-btn:hover { opacity: 0.9; }
        
        .back-link {
            display: block; text-align: center; margin-top: 20px;
            color: var(--grey); text-decoration: none; font-size: 0.9rem;
        }
        .back-link:hover { color: var(--dark); text-decoration: underline; }
        
        #pesan { text-align: center; margin-top: 15px; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="logo">🍽️ SmartDine</div>
        <div class="title">Pendaftaran Akun Baru</div>
        
        <form id="registerForm">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="regNama" class="input-field" placeholder="Masukkan nama lengkap" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="regUser" class="input-field" placeholder="Buat username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPass" class="input-field" placeholder="Buat password" required>
            </div>
            <div class="form-group">
                <label>Peran (Jabatan)</label>
                <select id="regPeran" class="input-field" required>
                    <option value="admin">Admin (Akses Penuh)</option>
                    <option value="dapur">Dapur (Manajemen Pesanan)</option>
                </select>
            </div>
            <button type="submit" class="confirm-btn">Daftar Sekarang</button>
        </form>
        
        <p id="pesan"></p>
        
        <div style="text-align: center; margin-top: 15px; font-size: 0.95rem;">
            Sudah punya akun? <a href="login.html" style="color: var(--brand); text-decoration: none; font-weight: 700;">Login di sini</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nama = document.getElementById('regNama').value;
            const user = document.getElementById('regUser').value;
            const pass = document.getElementById('regPass').value;
            const peran = document.getElementById('regPeran').value;
            const pesanEl = document.getElementById('pesan');

            pesanEl.style.color = '#6b7280';
            pesanEl.innerText = 'Memproses...';

            try {
                const response = await fetch('http://localhost:3000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        nama_lengkap: nama, 
                        username: user, 
                        password: pass, 
                        peran: peran 
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    pesanEl.style.color = '#27ae60'; // Warna hijau jika sukses
                    pesanEl.innerText = result.message;
                    
                    // Otomatis pindah ke halaman login setelah 2 detik
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    pesanEl.style.color = '#e74c3c'; // Warna merah jika gagal
                    pesanEl.innerText = result.message;
                }
            } catch (error) {
                pesanEl.style.color = '#e74c3c';
                pesanEl.innerText = 'Gagal terhubung ke server Node.js.';
            }
        });
    </script>
</body>
</html>
