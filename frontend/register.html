<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - SmartDine</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
    
    <!-- Panggil file CSS khusus register/login -->
    <link rel="stylesheet" href="css/login.css">
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>

    <div class="register-card">
        <div class="logo" style="display: flex; align-items: center; justify-content: center;">
            <img src="assets/logo.png" alt="SmartDine Logo" style="height: 90px; width: auto; object-fit: contain;">
        </div>
        <div class="title">Buat Akun Admin & Dapur</div>
        
        <form id="registerForm">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <!-- Atribut oninvalid digunakan untuk merubah teks pop-up peringatan -->
                <input type="text" id="regNama" class="input-field" placeholder="Masukkan nama lengkap" required
                       oninvalid="this.setCustomValidity('Nama lengkap tidak boleh kosong!')"
                       oninput="this.setCustomValidity('')">
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="regUser" class="input-field" placeholder="Buat username" required
                       oninvalid="this.setCustomValidity('Username tidak boleh kosong!')"
                       oninput="this.setCustomValidity('')">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPass" class="input-field" placeholder="Buat password" required
                       oninvalid="this.setCustomValidity('Silakan buat password Anda!')"
                       oninput="this.setCustomValidity('')">
            </div>
            <div class="form-group">
                <label>Peran (Jabatan)</label>
                <select id="regPeran" class="input-field" required
                        oninvalid="this.setCustomValidity('Pilih peran terlebih dahulu!')"
                        oninput="this.setCustomValidity('')">
                    <option value="admin">Admin (Akses Penuh)</option>
                    <option value="dapur">Dapur (Manajemen Pesanan)</option>
                </select>
            </div>
            <button type="submit" id="regSubmitBtn" class="confirm-btn">Daftar Sekarang</button>
        </form>
        
        <p id="pesan" style="text-align: center; margin-top: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;"></p>
        
        <div style="text-align: center; margin-top: 15px; font-size: 0.95rem;">
            Sudah punya akun? <a href="login.html" style="color: var(--brand); text-decoration: none; font-weight: 700;">Login di sini</a>
        </div>
    </div>

    <script src="js/login.js" defer></script>
</body>
</html>
